<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/soma-cross-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700;800&family=Jost:wght@300&display=swap" rel="stylesheet">
    <title>AI Study Planner for Students | Soma</title>
    <meta name="description" content="Soma is an AI-powered study planner that connects to Canvas, builds your schedule, tracks study time, and generates notes. Free for high school and college students." />
    <link rel="canonical" href="https://somastudy.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://somastudy.app/" />
    <meta property="og:title" content="Soma — AI Study Planner for Students" />
    <meta property="og:description" content="Connect Canvas, plan your day with AI, track study time, and generate notes — all in one app built for students." />
    <meta property="og:image" content="https://somastudy.app/og-image.png" />
    <meta property="og:site_name" content="Soma" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soma — AI Study Planner for Students" />
    <meta name="twitter:description" content="Connect Canvas, plan your day with AI, track study time, and generate notes — all in one app built for students." />
    <meta name="twitter:image" content="https://somastudy.app/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Soma",
      "url": "https://somastudy.app",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "AI-powered study planner that connects to Canvas, builds your schedule, tracks study time, and generates notes for high school and college students.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free 7-day trial, then $10.99/month"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "120"
      }
    }
    </script>
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('soma_settings') || '{}');
          var theme = s.theme || 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.style.background = 'oklch(13% 0.009 265)';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
